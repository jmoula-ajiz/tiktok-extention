<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TikTok Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0d;
        --surface: #161616;
        --line: rgba(255, 255, 255, 0.08);
        --red: #ff2d55;
        --cyan: #00e5ff;
        --green: #39ff14;
        --yellow: #ffe600;
        --dim: #555;
        --text: #f0f0f0;
        --mono: "Space Mono", monospace;
        --display: "Bebas Neue", sans-serif;
      }

      body {
        width: 380px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        overflow-x: hidden;
      }

      /* ── HEADER ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .logo {
        font-family: var(--display);
        font-size: 20px;
        letter-spacing: 0.06em;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-bar {
        width: 3px;
        height: 18px;
        background: var(--red);
        border-radius: 1px;
        animation: blink 1.4s step-end infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .export-btn {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--dim);
        background: none;
        border: 1px solid #2a2a2a;
        border-radius: 3px;
        padding: 4px 9px;
        cursor: pointer;
        transition: all 0.15s;
        text-transform: uppercase;
      }
      .export-btn:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }

      /* ── EMPTY ── */
      .empty-state {
        padding: 36px 20px;
        text-align: center;
      }
      .empty-icon {
        font-size: 28px;
        margin-bottom: 10px;
      }
      .empty-title {
        font-family: var(--display);
        font-size: 22px;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }
      .empty-sub {
        color: var(--dim);
        font-size: 10px;
      }

      /* ── CURRENT CARD ── */
      .current-card {
        padding: 14px;
        border-bottom: 1px solid var(--line);
        animation: fadeUp 0.2s ease;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* live + badges row */
      .card-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }

      .live-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--red);
      }
      .live-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.75);
        }
      }

      .pill {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 2px 6px;
        border-radius: 2px;
      }
      .pill-ad {
        background: rgba(255, 230, 0, 0.15);
        color: var(--yellow);
        border: 1px solid rgba(255, 230, 0, 0.3);
      }
      .pill-duet {
        background: rgba(0, 229, 255, 0.1);
        color: var(--cyan);
        border: 1px solid rgba(0, 229, 255, 0.25);
      }
      .pill-stitch {
        background: rgba(57, 255, 20, 0.08);
        color: var(--green);
        border: 1px solid rgba(57, 255, 20, 0.2);
      }

      /* author */
      .author-block {
        margin-bottom: 14px;
      }
      .author-name {
        font-family: var(--display);
        font-size: 26px;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .author-handle {
        color: var(--dim);
        font-size: 10px;
        margin-top: 2px;
      }

      /* stats 4-up */
      .stats-row {
        display: flex;
        align-items: stretch;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .stat-box {
        flex: 1;
        padding: 10px 0;
        text-align: center;
      }
      .stat-divider {
        width: 1px;
        background: var(--line);
        flex-shrink: 0;
      }
      .stat-num {
        font-family: var(--display);
        font-size: 20px;
        letter-spacing: 0.03em;
        color: var(--text);
        line-height: 1;
        margin-bottom: 2px;
      }
      .stat-lbl {
        font-size: 8px;
        letter-spacing: 0.1em;
        color: var(--dim);
      }

      /* signal row */
      .signal-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .signal-item {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .signal-label {
        font-size: 8px;
        letter-spacing: 0.1em;
        color: var(--dim);
        margin-bottom: 4px;
      }
      .signal-value {
        font-family: var(--display);
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--text);
        line-height: 1;
      }
      .signal-value.accent {
        color: var(--cyan);
      }
      .signal-value.green {
        color: var(--green);
      }
      .signal-value.red {
        color: var(--red);
      }

      /* caption */
      .caption-text {
        font-size: 10px;
        line-height: 1.6;
        color: rgba(240, 240, 240, 0.6);
        margin-bottom: 10px;
        padding: 8px 10px;
        background: var(--surface);
        border-left: 2px solid var(--red);
        border-radius: 0 4px 4px 0;
      }

      /* hashtags */
      .tags-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }
      .tag {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 7px;
        border-radius: 2px;
        background: rgba(255, 45, 85, 0.1);
        color: var(--red);
        border: 1px solid rgba(255, 45, 85, 0.22);
      }

      /* meta bar */
      .meta-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .meta-chip {
        font-size: 9px;
        color: var(--dim);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 7px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }

      /* ── HISTORY ── */
      .history-section {
        border-top: 1px solid var(--line);
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .section-title {
        font-size: 9px;
        letter-spacing: 0.12em;
        color: var(--dim);
        font-weight: 700;
      }
      .text-btn {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--dim);
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
        transition: color 0.15s;
        letter-spacing: 0.06em;
      }
      .text-btn:hover {
        color: var(--red);
      }

      .history-list {
        max-height: 200px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #2a2a2a transparent;
      }

      .h-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        transition: background 0.1s;
      }
      .h-row:hover {
        background: var(--surface);
      }
      .h-row-first {
        border-left: 2px solid var(--red);
      }

      .h-left {
        min-width: 0;
        flex: 1;
        margin-right: 8px;
      }
      .h-author {
        font-family: var(--display);
        font-size: 14px;
        letter-spacing: 0.03em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .h-tags {
        font-size: 9px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .h-right {
        text-align: right;
        flex-shrink: 0;
      }
      .h-likes {
        font-family: var(--display);
        font-size: 14px;
        color: var(--red);
        letter-spacing: 0.03em;
      }
      .h-time {
        font-size: 9px;
        color: var(--dim);
        margin-top: 1px;
      }

      /* ── NUTRITION SESSION ── */
      .nutrition-section {
        border-bottom: 1px solid var(--line);
      }
      .nutrition-head {
        border-top: 1px solid var(--line);
      }
      .nutrition-body {
        padding: 12px 14px 14px;
        font-size: 10px;
        line-height: 1.5;
      }
      .empty-nut {
        color: var(--dim);
      }
      .nut-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .nut-cell {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nut-k {
        font-size: 8px;
        letter-spacing: 0.1em;
        color: var(--dim);
      }
      .nut-v {
        font-family: var(--display);
        font-size: 18px;
        color: var(--text);
      }
      .nut-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .nut-cluster {
        margin-top: 8px;
        padding: 8px 10px;
        background: rgba(0, 229, 255, 0.06);
        border: 1px solid rgba(0, 229, 255, 0.15);
        border-radius: 4px;
        font-size: 9px;
        color: var(--cyan);
      }
      .nut-top {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .nut-tag {
        font-size: 8px;
        padding: 2px 6px;
        border-radius: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--dim);
      }
      .nut-disclaimer {
        margin-top: 10px;
        font-size: 8px;
        color: var(--dim);
        line-height: 1.4;
      }

      .heur-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }
      .pill-warn {
        background: rgba(255, 45, 85, 0.12);
        color: #ff8fa3;
        border: 1px solid rgba(255, 45, 85, 0.25);
      }
      .pill-anxiety {
        background: rgba(255, 230, 0, 0.08);
        color: var(--yellow);
        border: 1px solid rgba(255, 230, 0, 0.2);
      }
      .pill-click {
        background: rgba(255, 140, 0, 0.1);
        color: #ffb347;
        border: 1px solid rgba(255, 140, 0, 0.25);
      }
      .pill-info {
        background: rgba(255, 255, 255, 0.04);
        color: var(--dim);
        border: 1px solid var(--line);
      }
      .pill-good {
        background: rgba(57, 255, 20, 0.08);
        color: var(--green);
        border: 1px solid rgba(57, 255, 20, 0.2);
      }
      .hint-chip {
        max-width: 100%;
      }

      /* ── FRICTION ── */
      .friction-section {
        border-bottom: 1px solid var(--line);
      }
      .friction-body {
        padding: 12px 14px 14px;
      }
      .friction-row {
        display: flex;
        gap: 8px;
      }
      .friction-btn {
        flex: 1;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid var(--red);
        background: transparent;
        color: var(--red);
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .friction-btn:hover {
        background: rgba(255, 45, 85, 0.12);
      }
      .friction-btn-2 {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .friction-btn-2:hover {
        background: rgba(0, 229, 255, 0.1);
      }
      .break-timer {
        margin-top: 10px;
        padding: 10px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--green);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .break-timer.hidden,
      .hidden {
        display: none !important;
      }
      .friction-hint {
        margin-top: 8px;
        font-size: 8px;
        color: var(--dim);
        line-height: 1.4;
      }

      /* ── AI PANEL ── */
      .ai-section {
        border-bottom: 1px solid var(--line);
      }
      .ai-body {
        padding: 12px 14px 14px;
      }
      .ai-label {
        display: block;
        font-size: 8px;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin-bottom: 4px;
      }
      .ai-input {
        width: 100%;
        font-family: var(--mono);
        font-size: 10px;
        padding: 6px 8px;
        margin-bottom: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
      }
      .ai-run-btn {
        width: 100%;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 10px;
        border-radius: 4px;
        border: none;
        background: linear-gradient(90deg, var(--red), #c9184a);
        color: #fff;
        cursor: pointer;
        margin-top: 4px;
      }
      .ai-run-btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .ai-secondary-btn {
        width: 100%;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 8px;
        margin-top: 8px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--dim);
        cursor: pointer;
      }
      .ai-secondary-btn:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .bridge-status {
        font-size: 9px;
        color: var(--cyan);
        margin-bottom: 10px;
        line-height: 1.4;
      }
      .ai-disclaimer {
        margin-top: 10px;
        font-size: 8px;
        color: var(--dim);
        line-height: 1.45;
      }
      .ai-disclaimer code {
        font-size: 8px;
        color: var(--yellow);
      }
      .ai-status {
        margin-top: 8px;
        font-size: 9px;
        color: var(--yellow);
        min-height: 1em;
      }
      .ai-results-container {
        margin-top: 10px;
        max-height: 340px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #2a2a2a transparent;
      }
      .ai-results-container.hidden {
        display: none;
      }
      .ai-error-box {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 45, 85, 0.35);
        background: rgba(255, 45, 85, 0.08);
        margin-bottom: 10px;
      }
      .ai-error-box strong {
        display: block;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--red);
        margin-bottom: 6px;
      }
      .ai-http-tag {
        float: right;
        font-size: 8px;
        color: var(--dim);
        border: 1px solid var(--line);
        padding: 1px 6px;
        border-radius: 2px;
      }
      .ai-error-msg {
        font-size: 9px;
        line-height: 1.45;
        color: rgba(240, 240, 240, 0.85);
        clear: both;
        margin-top: 4px;
      }
      .ai-error-hint {
        font-size: 8px;
        color: var(--dim);
        margin-top: 8px;
        line-height: 1.4;
      }
      .ai-fallback-label {
        font-size: 8px;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 8px 0 6px;
      }
      .ai-analysis-card {
        border-radius: 6px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .ai-gemini-card {
        background: rgba(0, 229, 255, 0.06);
        border-color: rgba(0, 229, 255, 0.2);
      }
      .ai-offline-card {
        background: rgba(57, 255, 20, 0.05);
        border-color: rgba(57, 255, 20, 0.15);
      }
      .ai-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ai-card-title {
        font-family: var(--display);
        font-size: 16px;
        letter-spacing: 0.04em;
      }
      .ai-badge {
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 2px;
      }
      .ai-badge-gemini {
        color: var(--cyan);
        border: 1px solid rgba(0, 229, 255, 0.35);
      }
      .ai-badge-offline {
        color: var(--green);
        border: 1px solid rgba(57, 255, 20, 0.35);
      }
      .ai-topic-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .topic-chip {
        font-size: 8px;
        padding: 3px 7px;
        border-radius: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--red);
      }
      .ai-metric-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 9px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .ai-metric-k {
        color: var(--dim);
      }
      .ai-metric-v {
        color: var(--text);
        font-weight: 700;
        text-align: right;
      }
      .ai-card-p {
        font-size: 9px;
        line-height: 1.45;
        margin-top: 8px;
        color: rgba(240, 240, 240, 0.88);
      }
      .ai-card-muted {
        font-size: 8px;
        color: var(--dim);
      }
      .ai-card-action {
        border-left: 2px solid var(--cyan);
        padding-left: 8px;
        margin-top: 10px;
      }
      .ai-raw-snippet {
        font-size: 9px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ai-raw-details {
        margin-top: 8px;
        font-size: 9px;
      }
      .ai-raw-details summary {
        cursor: pointer;
        color: var(--dim);
        margin-bottom: 6px;
      }
      .ai-raw-pre {
        margin: 0;
        padding: 8px;
        background: #0a0a0a;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 8px;
        line-height: 1.35;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 160px;
        overflow-y: auto;
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <div class="logo-bar"></div>
        TT SCAN
      </div>
      <button class="export-btn" id="exportBtn">export CSV</button>
    </div>

    <div id="main"></div>

    <script src="popup.js"></script>
  </body>
</html>
